<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财务中台 · 快速原型</title>
<style>
/* external font import removed */

body {
    font-family: 'Inter', sans-serif;
    height: 100vh;
    overflow: hidden;
}

.sidebar {
    transition: width 0.3s ease-in-out;
    overflow-y: auto;
    height: 100vh;
    position: relative;
}

.sidebar::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
    z-index: 1;
    pointer-events: none;
}

.sidebar > div, .sidebar nav {
    position: relative;
    z-index: 2;
}

.sidebar.collapsed {
    width: 64px;
}

.sidebar.collapsed .sidebar-text {
    display: none;
}

.sidebar.collapsed .sidebar-icon {
    margin: 0 auto;
}

.sidebar-item {
    transition: all 0.2s ease-in-out;
    font-size: 0.875rem;
}

.sidebar-item:hover {
    background-color: rgba(255, 255, 255, 0.1);
}

.sidebar-item.active {
    background-color: rgba(255, 255, 255, 0.2);
    color: white;
    font-weight: 500;
}

.gradient-bg {
    background: linear-gradient(135deg, #003eb3 0%, #0056c7 100%);
}

.menu-header h2 {
    font-size: 0.875rem;
    color: rgba(255, 255, 255, 0.7);
}

/* 二级子菜单样式 */
.submenu-content {
    border-left: 1px solid rgba(255,255,255,0.15);
    margin-left: 12px;
    margin-top: 2px;
}
.submenu-header {
    user-select: none;
}
.submenu-content .sidebar-item.active {
    background: rgba(255,255,255,0.15);
}

.drawer {
    transition: transform 0.3s ease-in-out;
    transform: translateX(100%);
}

.drawer.open {
    transform: translateX(0);
}

.drawer-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 15;
    display: none;
}

.drawer-overlay.open {
    display: block;
}

.switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    transition: .4s;
    border-radius: 24px;
}

.slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
}

input:checked + .slider {
    background-color: #003eb3;
}

input:checked + .slider:before {
    transform: translateX(20px);
}

/* 表格样式 */
.table-container {
    overflow-x: auto;
}

.table-container table {
    min-width: 100%;
    border-collapse: collapse;
}

.table-container th {
    background-color: #f9fafb;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
}

.table-container td, .table-container th {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #e5e7eb;
}

.table-container tr:hover {
    background-color: #f9fafb;
}

/* 按钮样式 */
.btn {
    transition: all 0.2s ease-in-out;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-weight: 500;
    border-radius: 0.375rem;
    padding: 0.5rem 1rem;
}

.btn-primary {
    background-color: #003eb3;
    color: white;
    border: 1px solid #003eb3;
}

.btn-primary:hover {
    background-color: #0056c7;
}

.btn-secondary {
    background-color: white;
    color: #003eb3;
    border: 1px solid #003eb3;
}

.btn-secondary:hover {
    background-color: #e6f0ff;
}

.btn-outline {
    background-color: white;
    color: #6b7280;
    border: 1px solid #d1d5db;
}

.btn-outline:hover {
    background-color: #f3f4f6;
}

/* 输入框样式 */
.input-field {
    width: 100%;
    padding: 0.5rem 0.75rem;
    border: 1px solid #d1d5db;
    border-radius: 0.375rem;
    transition: all 0.2s ease-in-out;
}

.input-field:focus {
    outline: none;
    ring: 2px;
    ring-color: #003eb3;
    border-color: transparent;
}

/* 卡片样式 */
.card {
    background-color: white;
    border-radius: 0.5rem;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
    padding: 1.5rem;
}

/* 筛选栏样式 */
.filter-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
}

/* 分页样式 */
.pagination {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.25rem;
    margin-top: 1.5rem;
}

.pagination button {
    padding: 0.25rem 0.75rem;
    border: 1px solid #d1d5db;
    border-radius: 0.375rem;
    background-color: white;
    transition: all 0.2s ease-in-out;
}

.pagination button:hover:not(:disabled) {
    background-color: #f3f4f6;
}

.pagination button.active {
    background-color: #003eb3;
    color: white;
    border-color: #003eb3;
}

.pagination button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.hidden {
    display: none;
}

/* 响应式设计 */
@media (max-width: 768px) {
    .sidebar {
        width: 64px;
    }
    
    .sidebar .sidebar-text {
        display: none;
    }
    
    .sidebar .sidebar-icon {
        margin: 0 auto;
    }
    
    .main-content {
        margin-left: 64px;
    }
    
    .filter-bar {
        flex-direction: column;
        align-items: stretch;
    }
    
    .filter-bar > div {
        width: 100%;
    }
}

</style>

// 事件委托:侧边栏点击 -> 切 iframe.src
document.getElementById('sidebar-container').addEventListener('click', function(e) {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const href = a.getAttribute('href') || '';
  const m = href.match(/([\w\-]+\.html)(?:[?#].*)?$/);
  if (m) {
    e.preventDefault();
    e.stopPropagation();
    loadPage(m[1]);
  }
}, true);

// 加载 scripts.js(侧边栏折叠等)
(function(){
  const s = document.createElement('script');
  s.textContent = "// \u521d\u59cb\u5316Lucide\u56fe\u6807\nfunction initLucideIcons() {\n    if (typeof lucide !== 'undefined') {\n        lucide.createIcons();\n    }\n}\n\n// \u4fa7\u8fb9\u680f\u6298\u53e0/\u5c55\u5f00\u529f\u80fd\nfunction initSidebar() {\n    const toggleSidebar = document.getElementById('toggle-sidebar');\n    const sidebar = document.getElementById('sidebar');\n    const mainContent = document.getElementById('main-content');\n    \n    if (toggleSidebar && sidebar && mainContent) {\n        // \u79fb\u9664\u53ef\u80fd\u5b58\u5728\u7684\u65e7\u4e8b\u4ef6\u76d1\u542c\u5668\n        toggleSidebar.removeEventListener('click', handleSidebarToggle);\n        \n        // \u5b9a\u4e49\u5904\u7406\u51fd\u6570\n        function handleSidebarToggle() {\n            sidebar.classList.toggle('collapsed');\n            if (sidebar.classList.contains('collapsed')) {\n                mainContent.classList.remove('ml-64');\n                mainContent.classList.add('ml-16');\n            } else {\n                mainContent.classList.remove('ml-16');\n                mainContent.classList.add('ml-64');\n            }\n        }\n        \n        // \u6dfb\u52a0\u65b0\u7684\u4e8b\u4ef6\u76d1\u542c\u5668\n        toggleSidebar.addEventListener('click', handleSidebarToggle);\n    }\n}\n\n// \u83dc\u5355\u5c55\u5f00/\u6536\u62e2\u529f\u80fd\nfunction initMenu() {\n    const menuHeaders = document.querySelectorAll('.menu-header');\n    \n    menuHeaders.forEach(header => {\n        // \u79fb\u9664\u53ef\u80fd\u5b58\u5728\u7684\u65e7\u4e8b\u4ef6\u76d1\u542c\u5668\n        header.removeEventListener('click', handleMenuToggle);\n        \n        // \u5b9a\u4e49\u5904\u7406\u51fd\u6570\n        function handleMenuToggle() {\n            const menuName = header.getAttribute('data-menu');\n            const content = document.getElementById(`${menuName}-content`);\n            const icon = header.querySelector('.menu-icon');\n            \n            if (content && icon) {\n                // \u5207\u6362\u5185\u5bb9\u663e\u793a/\u9690\u85cf\n                content.classList.toggle('hidden');\n                \n                // \u5207\u6362\u56fe\u6807\u65cb\u8f6c\n                if (content.classList.contains('hidden')) {\n                    icon.style.transform = 'rotate(0deg)';\n                } else {\n                    icon.style.transform = 'rotate(180deg)';\n                }\n            }\n        }\n        \n        // \u6dfb\u52a0\u65b0\u7684\u4e8b\u4ef6\u76d1\u542c\u5668\n        header.addEventListener('click', handleMenuToggle);\n    });\n}\n\n// \u4e8c\u7ea7\u53ef\u6298\u53e0\u5b50\u83dc\u5355 (submenu-header + submenu-content)\nfunction initSubmenu() {\n    const submenuHeaders = document.querySelectorAll('.submenu-header');\n    submenuHeaders.forEach(header => {\n        function handleToggle(e) {\n            e.stopPropagation();\n            const name = header.getAttribute('data-submenu');\n            const content = document.getElementById(`${name}-content`);\n            const icon = header.querySelector('.submenu-icon');\n            if (content && icon) {\n                content.classList.toggle('hidden');\n                icon.style.transform = content.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';\n            }\n        }\n        header.addEventListener('click', handleToggle);\n    });\n}\n\n// \u9ad8\u4eae\u5f53\u524d\u9875\u9762\u7684\u5bfc\u822a\u9879\nfunction highlightCurrentPage() {\n    const currentPath = window.location.pathname;\n    const sidebarItems = document.querySelectorAll('.sidebar-item');\n    \n    sidebarItems.forEach(item => {\n        const href = item.getAttribute('href');\n        if (href && currentPath.includes(href)) {\n            item.classList.add('active');\n\n            // \u5c55\u5f00\u5305\u542b\u5f53\u524d\u9875\u9762\u7684\u4e8c\u7ea7\u5b50\u83dc\u5355\n            const submenuContent = item.closest('.submenu-content');\n            if (submenuContent) {\n                submenuContent.classList.remove('hidden');\n                const submenuHeader = submenuContent.previousElementSibling;\n                if (submenuHeader) {\n                    const subIcon = submenuHeader.querySelector('.submenu-icon');\n                    if (subIcon) subIcon.style.transform = 'rotate(180deg)';\n                }\n            }\n\n            // \u5c55\u5f00\u5305\u542b\u5f53\u524d\u9875\u9762\u7684\u83dc\u5355\n            const menuContent = item.closest('.menu-content');\n            if (menuContent) {\n                menuContent.classList.remove('hidden');\n                const menuHeader = menuContent.previousElementSibling;\n                if (menuHeader) {\n                    const icon = menuHeader.querySelector('.menu-icon');\n                    if (icon) {\n                        icon.style.transform = 'rotate(180deg)';\n                    }\n                }\n            }\n        }\n    });\n}\n\n// \u62bd\u5c49\u529f\u80fd\nfunction initDrawers() {\n    // \u521b\u5efa\u62bd\u5c49\u906e\u7f69\u5c42\n    let drawerOverlay = document.getElementById('drawer-overlay');\n    if (!drawerOverlay) {\n        drawerOverlay = document.createElement('div');\n        drawerOverlay.className = 'drawer-overlay';\n        drawerOverlay.id = 'drawer-overlay';\n        document.body.appendChild(drawerOverlay);\n    }\n    \n    // \u6253\u5f00\u62bd\u5c49\n    window.openDrawer = function(drawer) {\n        if (drawer && typeof drawer === 'object') {\n            drawer.classList.add('open');\n            drawerOverlay.classList.add('open');\n        }\n    };\n    \n    // \u5173\u95ed\u62bd\u5c49\n    window.closeDrawer = function(drawer) {\n        if (drawer && typeof drawer === 'object') {\n            drawer.classList.remove('open');\n            drawerOverlay.classList.remove('open');\n        }\n    };\n    \n    // \u70b9\u51fb\u906e\u7f69\u5c42\u5173\u95ed\u6240\u6709\u62bd\u5c49\n    drawerOverlay.removeEventListener('click', handleDrawerOverlayClick);\n    function handleDrawerOverlayClick() {\n        document.querySelectorAll('.drawer').forEach(drawer => {\n            drawer.classList.remove('open');\n        });\n        drawerOverlay.classList.remove('open');\n    }\n    drawerOverlay.addEventListener('click', handleDrawerOverlayClick);\n}\n\n// \u9ad8\u7ea7\u7b5b\u9009\u529f\u80fd\nfunction initAdvancedFilter() {\n    const advancedFilterBtn = document.getElementById('advanced-filter-btn');\n    const advancedFilter = document.getElementById('advanced-filter');\n    \n    if (advancedFilterBtn && advancedFilter) {\n        advancedFilterBtn.removeEventListener('click', handleAdvancedFilterToggle);\n        function handleAdvancedFilterToggle() {\n            advancedFilter.classList.toggle('hidden');\n            \n            // \u5207\u6362\u6309\u94ae\u6587\u672c\u548c\u56fe\u6807\n            if (!advancedFilter.classList.contains('hidden')) {\n                this.innerHTML = '\u6536\u8d77\u7b5b\u9009 <i data-lucide=\"chevron-up\" class=\"w-4 h-4 ml-1\"></i>';\n            } else {\n                this.innerHTML = '\u9ad8\u7ea7\u7b5b\u9009 <i data-lucide=\"chevron-down\" class=\"w-4 h-4 ml-1\"></i>';\n            }\n            \n            // \u91cd\u65b0\u521d\u59cb\u5316\u56fe\u6807\n            initLucideIcons();\n        }\n        advancedFilterBtn.addEventListener('click', handleAdvancedFilterToggle);\n    }\n}\n\n// \u7b5b\u9009\u6761\u4ef6\u9009\u62e9\u5668\u529f\u80fd\nfunction initFilterSelect() {\n    const filterSelect = document.getElementById('filter-select');\n    const filterInput = document.getElementById('filter-input');\n    \n    if (filterSelect && filterInput) {\n        filterSelect.removeEventListener('change', handleFilterSelectChange);\n        function handleFilterSelectChange() {\n            const selectedValue = this.value;\n            \n            // \u6839\u636e\u9009\u62e9\u7684\u7b5b\u9009\u6761\u4ef6\u66f4\u65b0\u5360\u4f4d\u7b26\n            if (selectedValue === 'code') {\n                filterInput.placeholder = '\u6309\u7f16\u7801\u641c\u7d22';\n            } else if (selectedValue === 'name') {\n                filterInput.placeholder = '\u6309\u540d\u79f0\u641c\u7d22';\n            } else if (selectedValue === 'status') {\n                filterInput.placeholder = '\u6309\u72b6\u6001\u641c\u7d22';\n            }\n            \n            // \u6e05\u7a7a\u8f93\u5165\u6846\n            filterInput.value = '';\n        }\n        filterSelect.addEventListener('change', handleFilterSelectChange);\n    }\n}\n\n// \u6279\u91cf\u64cd\u4f5c\u529f\u80fd\nfunction initBatchOperations() {\n    const selectAllCheckbox = document.querySelector('input[type=\"checkbox\"]');\n    if (selectAllCheckbox) {\n        selectAllCheckbox.removeEventListener('change', handleSelectAllChange);\n        function handleSelectAllChange() {\n            const checkboxes = document.querySelectorAll('table input[type=\"checkbox\"]');\n            checkboxes.forEach(checkbox => {\n                checkbox.checked = this.checked;\n            });\n        }\n        selectAllCheckbox.addEventListener('change', handleSelectAllChange);\n    }\n}\n\n// \u521d\u59cb\u5316\u6240\u6709\u529f\u80fd\nfunction initCommonFunctions() {\n    // \u786e\u4fddDOM\u5b8c\u5168\u52a0\u8f7d\n    if (document.readyState === 'loading') {\n        document.addEventListener('DOMContentLoaded', function() {\n            performInit();\n        });\n    } else {\n        performInit();\n    }\n    \n    function performInit() {\n        // \u7b49\u5f85\u4e00\u5c0f\u6bb5\u65f6\u95f4\u786e\u4fdd\u4fa7\u8fb9\u680f\u5b8c\u5168\u52a0\u8f7d\n        setTimeout(() => {\n            initLucideIcons();\n            initSidebar();\n            initMenu();\n            initSubmenu();\n            highlightCurrentPage();\n            initDrawers();\n            initAdvancedFilter();\n            initFilterSelect();\n            initBatchOperations();\n        }, 200);\n    }\n}\n\n// \u5bfc\u51fa\u521d\u59cb\u5316\u51fd\u6570\uff0c\u65b9\u4fbf\u52a8\u6001\u52a0\u8f7d\u65f6\u8c03\u7528\nwindow.initCommonFunctions = initCommonFunctions;";
  document.body.appendChild(s);
  if (typeof window.initCommonFunctions === 'function') {
    try { window.initCommonFunctions(); } catch(err) { console.warn(err); }
  }
})();

function loadPage(name) {
  const frame = document.getElementById('page-frame');
  frame.src = 'pages/' + name;
  document.querySelectorAll('#sidebar a').forEach(a => a.classList.remove('active'));
}

// 监听 iframe 内跳转
window.addEventListener('message', (e) => {
  const data = e.data || {};
  if (data.type === 'navigate' && data.page) loadPage(data.page);
});
